<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu ZapSales — Protótipo 1 · Mesa de trabalho</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  .p1-lado { width: 272px; flex: none; display: flex; flex-direction: column; background: var(--color-surface); border-right: 1px solid var(--color-border); }
  .p1-topo-lado { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .p1-nav { flex: 1; overflow: auto; padding: 0 8px 10px; }
  .p1-dia { background: color-mix(in srgb, var(--color-accent) 6%, var(--color-surface)); border: 1px solid color-mix(in srgb, var(--color-accent) 18%, var(--color-border)); border-radius: 12px; padding: 8px 6px 6px; margin-bottom: 12px; }
  .p1-dia h2 { margin: 2px 8px 6px; font-size: 13px; font-weight: 700; color: var(--color-accent-text); }
  .p1-dia .zs-item { min-height: 38px; }
  .p1-cab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; text-align: left; }
  .p1-cab:hover { background: color-mix(in srgb, var(--color-accent) 7%, transparent); }
  .p1-cab .c { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--color-subtle); }
  .p1-cab .cs { transition: transform 0.2s var(--ease); display: grid; }
  .p1-cab .cs svg { width: 14px; height: 14px; }
  .p1-cab[aria-expanded="true"] .cs { transform: rotate(180deg); }
  .p1-cab .zs-ic svg { width: 20px; height: 20px; }
  .p1-corpo { padding: 0 0 6px 6px; margin-left: 14px; border-left: 1px solid var(--color-border); }
  .p1-pe { padding: 8px; border-top: 1px solid var(--color-border); position: relative; }
  .p1-mobile-topo { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
  .p1-mobile-topo .espaco { flex: 1; }
  .p1-mobile-topo .zs-av { width: 34px; height: 34px; background: var(--color-accent-soft); color: var(--color-accent-text); }
  .p1-btn-ic { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--color-muted); }
  .p1-btn-ic:hover { background: var(--color-elev); }
  .p1-folha-bloco { margin-top: 8px; }
  .p1-folha-bloco > h3 { margin: 14px 10px 2px; font-size: 15px; }
  .p1-folha .zs-item { min-height: 44px; font-size: 15px; }
</style>
</head>
<body>
<script src="assets/icones.js"></script>
<script src="assets/dados.js"></script>
<script src="assets/nucleo.js"></script>
<script>
const ui = { aberto: {}, conta: false };
document.addEventListener("zs-fechar", () => { ui.conta = false; });
ZS.iniciar({
  titulo: "1 · Mesa de trabalho",
  ideia: "A barra lateral de sempre, redesenhada pela rotina: o que se abre toda hora fica numa mesa fixa no alto, com contadores; Configurar e Resultados ficam recolhidos e abrem por tema. É a opção que menos assusta quem já usa o produto.",
  montar(tela, Z) {
    const { h, ic } = Z, atual = Z.atual();

    function blocoDisclosure(id) {
      const b = Z.D.BLOCOS.find((x) => x.id === id), ds = Z.porBloco(id);
      if (!ds.length) return null;
      const aberto = ui.aberto[id] ?? (atual.bloco === id);
      const cab = h("button", { class: "p1-cab", type: "button", "aria-expanded": String(aberto), onclick: () => { ui.aberto[id] = !aberto; Z.set({}); } },
        ic(b.ic), h("span", null, b.rot), h("span", { class: "c" }, ds.length + (ds.length === 1 ? " tela" : " telas")), h("span", { class: "cs", html: '<svg viewBox="0 0 256 256" fill="currentColor"><path d="M213.66 101.66l-80 80a8 8 0 0 1-11.32 0l-80-80a8 8 0 0 1 11.32-11.32L128 164.69l74.34-74.35a8 8 0 0 1 11.32 11.32Z"/></svg>' }));
      const corpo = aberto ? h("div", { class: "p1-corpo" }, Z.D.TEMAS.filter((t) => t.bloco === id).map((t) => Z.secao(t, { pin: true }))) : null;
      return h("div", null, cab, corpo);
    }
    function mesa() {
      const fx = Z.fixados(), op = Z.porTema("opcional");
      return h("section", { class: "p1-dia", "aria-label": "Todo dia" }, h("h2", null, "Todo dia"), Z.lista(Z.porTema("principal")),
        fx.length ? [h("div", { class: "zs-sub" }, "Fixados por você"), Z.lista(fx, { pin: true })] : null,
        op.length ? [h("div", { class: "zs-sub" }, "Se a sua empresa usa"), Z.lista(op)] : null);
    }
    function menuConta(flutuante) {
      const conta = Z.porTema("conta");
      return h("div", { class: flutuante ? "zs-flutua" : "", style: flutuante ? "left:10px;right:10px;bottom:64px" : "" }, Z.lista(conta));
    }
    const eu = () => { const p = Z.papel(); return h("button", { class: "zs-eu", type: "button", "aria-haspopup": "menu", "aria-expanded": String(ui.conta), onclick: () => { ui.conta = !ui.conta; Z.set({}); } }, h("span", { class: "zs-av" }, p.pessoa.split(" ").map((x) => x[0]).join("")), h("span", null, h("div", { class: "n" }, p.pessoa), h("div", { class: "p" }, p.papel))); };

    // ── Computador ──
    const lado = h("aside", { class: "p1-lado", "aria-label": "Menu principal" },
      h("div", { class: "p1-topo-lado" }, Z.marca(), Z.botaoBusca()),
      h("nav", { class: "p1-nav", "data-scroll": "nav", "aria-label": "Navegação principal" }, mesa(), blocoDisclosure("montar"), blocoDisclosure("acompanhar")),
      h("div", { class: "p1-pe" }, ui.conta ? menuConta(true) : null, eu()));
    const dk = h("div", { class: "dk" }, lado, Z.conteudo());

    // ── Celular ──
    const prio = ["/inbox", "/kanban", "/ai/cases", "/tasks", "/radar", "/contacts", "/agenda"];
    const abas = prio.map((id) => Z.porTema("principal").find((d) => d.id === id)).filter(Boolean).slice(0, 4);
    const aba = (d) => h("a", { href: "#" + d.id, "aria-current": d.id === atual.id ? "page" : null, onclick: (e) => { e.preventDefault(); Z.ir(d.id); } }, ic(d.ic, d.id === atual.id ? "fill" : "regular"), d.rot, d.n && Z.D.CONTADORES[d.n] ? h("span", { class: "zs-n" }, Z.D.CONTADORES[d.n]) : null);
    const mais = h("button", { type: "button", onclick: () => Z.abrirFolha(h("div", { class: "p1-folha" },
      h("div", { class: "zs-sub" }, "Todo dia"), Z.lista(Z.porTema("principal").concat(Z.porTema("opcional"))),
      ["montar", "acompanhar"].map((id) => { const b = Z.D.BLOCOS.find((x) => x.id === id); return Z.porBloco(id).length ? h("div", { class: "p1-folha-bloco" }, h("h3", null, b.rot), Z.D.TEMAS.filter((t) => t.bloco === id).map((t) => Z.secao(t, { pin: true }))) : null; }),
      h("div", { class: "p1-folha-bloco" }, h("h3", null, "Você"), Z.lista(Z.porTema("conta"))))) }, ic("List"), "Mais");
    const mb = h("div", { class: "mb" },
      h("header", { class: "p1-mobile-topo" }, Z.marca(), h("span", { class: "espaco" }), h("button", { class: "p1-btn-ic", type: "button", "aria-label": "Buscar uma tela", onclick: Z.abrirBusca }, ic("MagnifyingGlass")), h("span", { class: "zs-av" }, Z.papel().pessoa.split(" ").map((x) => x[0]).join(""))),
      Z.conteudo(), h("nav", { class: "zs-tabbar", "aria-label": "Atalhos" }, abas.map(aba), mais));
    tela.append(dk, mb);
  }
});
</script>
</body>
</html>
